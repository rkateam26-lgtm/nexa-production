<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NEXA — Bienvenue Restaurateur (Étape R1)</title>
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="styles.css">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background: var(--bg-whitey);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      margin: 0;
    }

    .resto-r1-card {
      background: #FFFFFF;
      border: 1px solid var(--dash-border);
      border-radius: var(--radius-lg);
      padding: 2.5rem 1.75rem;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: var(--shadow-lg);
      animation: fadeIn 0.3s ease-out forwards;
    }

    .resto-r1-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      font-family: var(--font-heading);
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--marron-dark);
      margin-bottom: 1.5rem;
    }

    .resto-r1-logo .brand-badge {
      background: var(--primary-gold);
      color: white;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 900;
      box-shadow: 0 4px 14px rgba(229, 57, 53, 0.3);
    }

    .resto-r1-tagline {
      font-family: var(--font-heading);
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--marron-dark);
      margin-bottom: 0.75rem;
      line-height: 1.3;
    }

    .resto-r1-subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    .btn-next-r1 {
      background: var(--primary-gold);
      color: white;
      font-weight: 800;
      font-size: 1rem;
      padding: 0.95rem 1.5rem;
      border-radius: var(--radius-full);
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      box-shadow: 0 4px 16px rgba(229, 57, 53, 0.3);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .btn-next-r1:hover {
      background: #C62828;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(229, 57, 53, 0.4);
    }

    .btn-next-r1:active {
      transform: translateY(0);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- ==========================================================================
       ÉCRAN R1 : BIENVENUE SUR NEXA (RESTAURATEUR)
       ========================================================================== -->
  <div class="resto-r1-card">
    
    <!-- BRAND LOGO NEXA -->
    <div class="resto-r1-logo">
      <div class="brand-badge">N</div>
      <span>Nexa<span style="color: var(--primary-gold);">.</span></span>
    </div>

    <!-- MESSAGE PROFESSIONNEL R1 -->
    <h1 class="resto-r1-tagline">« Build loyalty. Drive growth. »</h1>
    
    <p class="resto-r1-subtitle">
      La solution de fidélisation intelligente pour booster le chiffre d'affaires et la récurrence de vos clients.
    </p>

    <!-- BOUTON PRINCIPAL "SUIVANT" (PRÉPARATION R2) -->
    <button class="btn-next-r1" onclick="goToStepR2()">
      <span>Suivant</span>
      <i data-lucide="arrow-right"></i>
    </button>

  </div>

  <script>
    // Initialize Lucide Icons
    if (window.lucide) {
      try { lucide.createIcons(); } catch (e) {}
    }

    // NAVIGATION PREPARATION FOR STEP R2
    function goToStepR2() {
      // Prepared route placeholder for upcoming Step R2 (Créer un compte / Se connecter)
      alert("➡️ Étape R2 à venir : Créer un compte / Se connecter");
    }
  </script>

</body>
</html>
